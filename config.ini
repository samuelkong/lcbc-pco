[AUTH]
client_id = YOUR_CLIENT_ID
secret = YOUR_SECRET

[ENDPOINT]
base_url = https://api.planningcenteronline.com
calendar_url = %(base_url)s/calendar/v2
check_ins_url = %(base_url)s/check-ins/v2
giving_url = %(base_url)s/giving/v2
groups_url = %(base_url)s/groups/v2
people_url = %(base_url)s/people/v2
publishing_url = %(base_url)s/publishing/v2
registrations_url = %(base_url)s/registrations/v2
services_url = %(base_url)s/services/v2

[REQUEST]
max_page_size = 100
request_rate_limit = 100
request_rate_period = 20
